# Configuracion de publicacion de esta app para tools/macos/publish_release.sh (la pieza
# canonica de LGA_Base_QT_C_Py). Solo variables: la logica vive en la pieza. Parametros en
# ../LGA_Base_QT_C_Py/docs/Doc_Deploy_macOS.md §5.
APP_NAME="LGA ThetaExplorer"
ARTIFACT_NAME="LGA_ThetaExplorer"
RELEASE_REPO="legandrop/LGA_ThetaExplorer"
# No hay archivo VERSION: la version sale de CMakeLists.txt (la ultima PUBLICADA; la del changelog
# es la que esta en desarrollo). `--check` sale con error si falta el bump o no esta commiteado.
VERSION_CMD="sed -n 's/^[[:space:]]*project(.*VERSION[[:space:]]\\{1,\\}\\([0-9][0-9.]*\\).*/\\1/p' CMakeLists.txt | head -1"
VERSION_CHECK_CMD="sh ./bump_version.sh --check"
# Para `--decide`: la version en desarrollo es la que encabeza el changelog, y el bump la sube a
# CMakeLists.txt con commit + push, sin ofrecer publicar (de eso se encarga deploy.sh).
DEV_VERSION_FILE="docs/ChangeLog.md"
BUMP_CMD="sh ./bump_version.sh --commit --no-publish"
# Sin SHA256SUMS de macOS: el de este release lo sube Windows (tools/windows/build_installer.ps1) solo
# con su linea y sin --clobber, asi que si la Mac lo creara, la publicacion de Windows fallaria. El
# updater no lo usa: verifica contra el digest del manifiesto. Sin What's new: el cuerpo del release
# son las notas de abajo, que no se pisan.
SHA256SUMS=false
WHATS_NEW_FILE=""
RELEASE_TITLE="LGA ThetaExplorer v{v}"
RELEASE_NOTES='LGA ThetaExplorer v{v} for macOS 12 or later (Apple Silicon and Intel).

**Install:** download `LGA_ThetaExplorer_Mac_v{v}.dmg`, open it and drag the app onto Applications.
The app is not notarized by Apple: if macOS says it can'"'"'t be opened, run
`sudo xattr -cr "/Applications/LGA ThetaExplorer.app"` in Terminal and open it again.
The DMG includes a Read Me with the same steps.

See the [README](https://github.com/legandrop/LGA_ThetaExplorer#readme) for what the app does.'
